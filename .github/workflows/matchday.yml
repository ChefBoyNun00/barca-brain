name: Matchday Room

on:
  schedule:
    # Every 15 minutes, so a lineup announced an hour before kickoff shows up in time.
    # Off the hour because GitHub delays jobs most at the top of each hour.
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch: # adds a "Run workflow" button for manual runs

# Never let two runs overlap: they would write the same rows.
concurrency:
  group: matchday
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  matchday:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Scripts are skipped so the Supabase CLI binary is not downloaded: this job does not need it.
      - run: npm ci --ignore-scripts
      - run: npm run matchday
        env:
          FOOTBALL_PROVIDER: ${{ secrets.FOOTBALL_PROVIDER }}
          DATABASE_URL_INGEST: ${{ secrets.DATABASE_URL_INGEST }}
